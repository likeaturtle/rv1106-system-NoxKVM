name: Upload to COS (Test)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.8)'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID to download artifacts from (leave empty to use dummy test files)'
        required: false
        type: string

env:
  COS_BASE_PATH: noxkvm/firmware
  COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
  COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
  COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
  COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}

jobs:
  upload-cos:
    runs-on: ubuntu-latest
    name: Upload to Tencent COS
    steps:
      - name: Install coscli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            "https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64"
          echo "a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915  $HOME/.local/bin/coscli" | sha256sum -c -
          chmod 755 "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download artifacts from specified run
        if: ${{ inputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dummy test files
        if: ${{ inputs.run_id == '' }}
        run: |
          echo "No run_id provided, creating dummy test files"
          mkdir -p OTA-Image Full-Image jetkvm-native-buildkit
          dd if=/dev/urandom of=OTA-Image/update_ota.tar bs=1K count=100
          dd if=/dev/urandom of=Full-Image/update.img bs=1K count=100
          dd if=/dev/urandom of=jetkvm-native-buildkit/buildkit.tar.zst bs=1K count=100

      - name: List files
        run: |
          echo "=== Files to upload ==="
          find . -maxdepth 3 -type f ! -path './.git/*'

      - name: Verify COS credentials
        run: |
          echo "COS_BUCKET=$COS_BUCKET"
          echo "COS_REGION=$COS_REGION"
          echo "COS_SECRET_ID=${COS_SECRET_ID:0:8}***"
          echo "Endpoint=cos.${COS_REGION}.myqcloud.com"
          COSCLI_AUTH=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.${COS_REGION}.myqcloud.com")
          echo "--- Listing COS base path ---"
          coscli "${COSCLI_AUTH[@]}" ls "cos://${COS_BUCKET}/${COS_BASE_PATH}/"
          echo "COS authentication OK"

      - name: Upload firmware to COS
        run: |
          VERSION=${{ inputs.version }}
          COSCLI_AUTH=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.${COS_REGION}.myqcloud.com")
          COSCLI_CP_OPTS=(--part-size 1 --thread-num 16 --err-retry-num 5 --err-retry-interval 5)

          upload_versioned_and_latest() {
            local src="$1" versioned_path="$2"
            echo ">>> Uploading $src -> ${versioned_path}"
            coscli "${COSCLI_AUTH[@]}" cp "${COSCLI_CP_OPTS[@]}" \
              "$src" "cos://${COS_BUCKET}/${COS_BASE_PATH}/${versioned_path}"
            echo ">>> Copying to latest: ${versioned_path#*/}"
            coscli "${COSCLI_AUTH[@]}" cp \
              "cos://${COS_BUCKET}/${COS_BASE_PATH}/${versioned_path}" \
              "cos://${COS_BUCKET}/${COS_BASE_PATH}/latest/${versioned_path#*/}"
          }

          upload_versioned_and_latest OTA-Image/update_ota.tar "${VERSION}/update_ota.tar"
          upload_versioned_and_latest Full-Image/update.img "${VERSION}/update.img"
          upload_versioned_and_latest jetkvm-native-buildkit/buildkit.tar.zst "${VERSION}/buildkit.tar.zst"

      - name: Upload metadata.json to COS
        run: |
          VERSION=${{ inputs.version }}
          SYSTEM_HASH=$(shasum -a 256 OTA-Image/update_ota.tar | cut -d ' ' -f 1)
          SYSTEM_URL="https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/${COS_BASE_PATH}/latest/update_ota.tar"

          printf '{"systemVersion":"%s","systemUrl":"%s","systemHash":"%s"}\n' \
            "$VERSION" "$SYSTEM_URL" "$SYSTEM_HASH" > metadata.json

          COSCLI_AUTH=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.${COS_REGION}.myqcloud.com")

          coscli "${COSCLI_AUTH[@]}" cp metadata.json \
            "cos://${COS_BUCKET}/${COS_BASE_PATH}/${VERSION}/metadata.json"
          coscli "${COSCLI_AUTH[@]}" cp metadata.json \
            "cos://${COS_BUCKET}/${COS_BASE_PATH}/latest/metadata.json"
