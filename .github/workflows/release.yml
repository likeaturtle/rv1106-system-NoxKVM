name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.4.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build firmware
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf autotools-dev \
            device-tree-compiler \
            gperf g++-multilib gcc-multilib \
            libnl-3-dev libdbus-1-dev libelf-dev libmpc-dev dwarves \
            zip

      - name: Set version
        id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ inputs.version }}
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
          echo "$VERSION" > VERSION

      - name: Update jetkvm_app
        run: ./update_app.sh

      - name: Build
        run: |
          echo "Version: ${{ steps.set-version.outputs.version }}"
          ./build.sh lunch BoardConfig_IPC/BoardConfig-NAND-NONE-RV1106_JETKVM_V2.mk
          ./build.sh

      - name: Upload OTA image
        uses: actions/upload-artifact@v4
        with:
          name: OTA-Image
          path: output/image/update_ota.tar
          retention-days: 7

      - name: Upload Full image
        uses: actions/upload-artifact@v4
        with:
          name: Full-Image
          path: output/image/update.img
          retention-days: 7

      - name: Create compressed buildkit
        run: ./make_buildkit.sh

      - name: Upload buildkit
        uses: actions/upload-artifact@v4
        with:
          name: jetkvm-native-buildkit
          path: buildkit.tar.zst
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          for dir in OTA-Image Full-Image jetkvm-native-buildkit; do
            for f in "$dir"/*; do
              fname=$(basename "$f")
              shasum -a 256 "$f" | cut -d ' ' -f 1 > "${fname}.sha256"
            done
          done

      - name: Prepare release files
        run: |
          mkdir -p release
          mv OTA-Image/* Full-Image/* jetkvm-native-buildkit/* release/
          mv *.sha256 release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: release/*
          generate_release_notes: true

  upload-cos:
    needs: [build, release]
    runs-on: ubuntu-latest
    name: Upload to Tencent COS
    env:
      COS_BASE_PATH: noxkvm/firmware
      COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Install coscli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            "https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64"
          echo "a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915  $HOME/.local/bin/coscli" | sha256sum -c -
          chmod 755 "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload firmware to COS
        run: |
          VERSION=${{ needs.build.outputs.version }}
          COSCLI_AUTH=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.${COS_REGION}.myqcloud.com")
          COSCLI_CP_OPTS=(--part-size 1 --thread-num 16 --err-retry-num 5 --err-retry-interval 5)

          upload_versioned_and_latest() {
            local src="$1" versioned_path="$2"
            coscli "${COSCLI_AUTH[@]}" cp "${COSCLI_CP_OPTS[@]}" \
              "$src" "cos://${COS_BUCKET}/${COS_BASE_PATH}/${versioned_path}"
            coscli "${COSCLI_AUTH[@]}" cp \
              "cos://${COS_BUCKET}/${COS_BASE_PATH}/${versioned_path}" \
              "cos://${COS_BUCKET}/${COS_BASE_PATH}/latest/${versioned_path#*/}"
          }

          upload_versioned_and_latest OTA-Image/update_ota.tar "${VERSION}/update_ota.tar"
          upload_versioned_and_latest Full-Image/update.img "${VERSION}/update.img"
          upload_versioned_and_latest jetkvm-native-buildkit/buildkit.tar.zst "${VERSION}/buildkit.tar.zst"

      - name: Upload metadata.json to COS
        run: |
          VERSION=${{ needs.build.outputs.version }}
          SYSTEM_HASH=$(shasum -a 256 OTA-Image/update_ota.tar | cut -d ' ' -f 1)
          SYSTEM_URL="https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/${COS_BASE_PATH}/latest/update_ota.tar"

          printf '{"systemVersion":"%s","systemUrl":"%s","systemHash":"%s"}\n' \
            "$VERSION" "$SYSTEM_URL" "$SYSTEM_HASH" > metadata.json

          COSCLI_AUTH=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.${COS_REGION}.myqcloud.com")

          coscli "${COSCLI_AUTH[@]}" cp metadata.json \
            "cos://${COS_BUCKET}/${COS_BASE_PATH}/${VERSION}/metadata.json"
          coscli "${COSCLI_AUTH[@]}" cp metadata.json \
            "cos://${COS_BUCKET}/${COS_BASE_PATH}/latest/metadata.json"

  update-cos-index:
    needs: [build, upload-cos]
    runs-on: ubuntu-latest
    name: Trigger cos-index-repo update
    steps:
      - name: Dispatch workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COS_INDEX_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'likeaturtle',
              repo: 'cos-index-repo',
              workflow_id: 'update-cos-index.yml',
              ref: 'main'
            });
